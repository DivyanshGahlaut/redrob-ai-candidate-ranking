# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Claude"
  # Other options: "ChatGPT", "Copilot", "Cursor", "Gemini", "Other", "None"

ai_usage_summary: |
  Used Claude (Anthropic) for architecture discussion, code review, data
  exploration of candidate patterns (title/skill/honeypot trap detection),
  iterative debugging of the scoring logic (including catching and fixing a
  keyword-stuffer-vulnerability bug in the skill-trust-weighting function),
  and test design. All scoring logic, feature engineering decisions, and
  weight calibration were reviewed and validated against the actual
  candidates.jsonl dataset before finalizing. No candidate data was sent to
  any external API during the ranking step itself -- the ranking pipeline
  runs entirely locally with no network access, per the compute constraints.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Multi-signal ranker, no LLM calls during ranking (CPU-only, <90s for 100K
  candidates). Components: (1) TF-IDF + truncated SVD semantic similarity
  between candidate free text and the JD's meaning-dense sections; (2)
  trust-weighted structured skill matching against the JD's must-have/
  nice-to-have skill inventory, where skill credit is gated by
  duration_months and endorsements rather than the proficiency label alone
  -- the direct countermeasure to the dataset's keyword-stuffer trap (~5,200
  candidates with irrelevant titles but AI-keyword-stuffed skill lists); (3)
  title-relevance bucketing and title<->description coherence checks; (4)
  multiplicative disqualifier penalties for the JD's named near-hard-no's
  (pure-services-only career, research-only/no-production, CV-or-speech-
  primary without NLP, architecture drift, frequent job-hopping, non-India
  location without visa sponsorship); (5) a behavioral-signal multiplier
  from the 23 redrob_signals fields (recency-decayed last-active, recruiter
  response rate, interview completion, offer acceptance); (6) a 4-check
  internal-consistency honeypot detector hard-gating candidates with 2+
  independent flags (YOE-vs-history mismatch, duration-vs-dates mismatch,
  expert-with-zero-duration skills, education date inversion). Full 100K
  run: ~80s, ~2.8GB peak RAM, 0 honeypots in final top 100.

